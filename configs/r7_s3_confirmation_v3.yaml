# S3 confirmation instance v3: five complete calendar years of the four frozen
# season blocks (train 2017-2021 / val 2022 / test 2023), year-mode splits.
# The expanded train split is the response to the registered S3-UB/S3-BC budget
# readings: on one train year the update budget is saturating, so the next
# capability investment is data (batch-3 acquisition, 2018-2021).
# Frozen in outputs/r7_s3_confirmation_train2017_2021_v3/store_build_protocol.json.
# No download or write occurs unless prepare_r7_local.py receives --write.
split_years:
  train: [2017, 2018, 2019, 2020, 2021]
  val: [2022]
  test: [2023]
history_steps: 2
history_interval_hours: 6
lead_time_hours: 6
sample_stride_hours: 6
time_chunk: 16
compute_process_targets: true
# channels omitted -> the existing 17-channel ERA5 long-name schema.
