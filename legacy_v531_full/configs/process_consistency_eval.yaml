# V5.1 process-consistency evaluation manifest configuration.
# 用于可行性、结构与过程一致性代理指标的轻量诊断，不读取 future target 之外的信息。

data_root: /3240608030/weather-q/data/processed_data/beijing

data:
  expose_hour: true

dynamic_vars: [d2m, sp, t2m, tcc, tp, u10, v10]
static_vars: [landcover, building_surface, buildings, building_volume, population]
include_static: true
broadcast_static: true

static_schema:
  categorical: [landcover]
  continuous: [building_surface, buildings, building_volume, population]
  categorical_cardinality:
    landcover: 20

k: 4
delta_t: 1
H: 8
W: 8

forecast:
  time_step_hours: 6
  lead_times: [1, 2, 3, 4]
  eval_lead_times: [1, 2, 3, 4]

model:
  D: 128
  depth: 4
  heads: 4
  mlp_ratio: 4.0
  drop_path_rate: 0.0
  dropout: 0.0

diffusion:
  P_mean: -0.8
  P_std: 0.8
  sample_steps: 8

losses:
  feasibility:
    enabled: true
    lambda: 0.2
  structure:
    enabled: true
    fft_enabled: true
    grad_enabled: true
    lambda_fft: 0.05
    lambda_grad: 0.5
  process:
    enabled: true
    lambda_rh: 0.1
    lambda_drag: 0.1
    lambda_diurnal: 0.1

physics:
  lambda: 0.2
  lambda_fft: 0.05
  lambda_grad: 0.5
  w_tp_nonneg: 1.0
  w_tcc_01: 1.0
  w_dew_leq_t: 0.5
  w_sp_nonneg: 0.1
  w_wind_div: 0.1
  fft_channel_weights: [1.0, 1.0, 1.0, 0.0, 0.0, 0.5, 0.5]
  grad_channel_weights: [1.0, 1.0, 1.0, 0.0, 0.0, 1.0, 1.0]

ablation:
  use_cross_attention: true
  use_position_encoding: true
  use_timestep_conditioning: true
  use_lead_time_conditioning: true
  use_channel_weights: true
  use_physics_loss: true
  use_fft_loss: true
  use_gradient_loss: true
  use_hard_physics: false
  use_static_morphology_encoder: true
  use_morphology_graph: true
  use_wind_aware_graph: true
  use_dynamic_vg: false
  use_static_vg: false
  use_micromet_coupling: true
  use_urban_canopy_coupling: false
  use_urban_canopy: false

morphology_graph:
  k: 8
  sigma: 1.0
  morphology_sigma: 1.0
  spatial_sigma: 1.0
  wind_temperature: 0.25
  wind_strength: 1.0
  roughness_blocking_strength: 0.5
  enable_cache: false

micromet_coupling:
  enabled: true
  mode: pre
  interleaved_interval: 2
  hidden_channels: 32
  dropout: 0.0
  enable_momentum_drag: true
  enable_thermal_storage: true
  enable_moisture_evaporation: true
  enable_ventilation_mixing: true
  max_drag: 0.2
  max_branch_scale: 0.1
  graph_cfg:
    k: 8
    sigma: 1.0
    wind_temperature: 0.25
    wind_strength: 1.0
    roughness_blocking_strength: 0.5
    enable_cache: false

experiment:
  protocol: v51_process_consistency_eval
  default_dry_run: true
  output_dir: results/process_consistency
  diagnostics:
    feasibility: [tp_nonnegative, tcc_range, dewpoint_temperature_order, pressure_positive]
    structure: [fft_spectrum, spatial_gradient, wind_divergence]
    process: [rh_consistency, morphology_drag_consistency, diurnal_thermal_response]

train:
  seed: 42
  batch_size: 128
  num_workers: 8
  lr: 0.0001
  weight_decay: 0.0001
  max_epochs: 200

eval:
  batch_size: 128
  num_workers: 8

metrics:
  deterministic:
    enabled: true

logging:
  log_dir: logs
  run_name: urbanpidit_v51_process_consistency_eval
  use_tensorboard: false
  use_wandb: false