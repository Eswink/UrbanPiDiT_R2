version:
  name: UrbanPiDiT-V5.3.1-MorphoProcessDiT-PhysicsNeMoCorrDiffBaseline
  external_sources:
    corrdiff: baselines/external_sources/physicsnemo_weather_corrdiff
data_root: /3240608030/weather-q/data/processed_data/beijing
data:
  expose_hour: true
dynamic_vars:
- d2m
- sp
- t2m
- tcc
- tp
- u10
- v10
static_vars:
- landcover
- building_surface
- buildings
- building_volume
- population
include_static: true
broadcast_static: true
static_schema:
  categorical:
  - landcover
  continuous:
  - building_surface
  - buildings
  - building_volume
  - population
  categorical_cardinality:
    landcover: 20
k: 4
delta_t: 1
H: 8
W: 8
forecast:
  time_step_hours: 6
  lead_times:
  - 1
  - 2
  - 3
  - 4
  eval_lead_times:
  - 1
  - 2
  - 3
  - 4
train:
  batch_size: 32
  num_workers: 4
eval:
  batch_size: 64
  num_workers: 4
external_baseline_training:
  epochs: 2
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip: 1.0
  save_best: true
  early_stopping:
    enabled: true
    monitor: val_6h_mse
    mode: min
    patience: 8
    min_delta: 0.0
    restore_best: true
  checkpoint:
    enabled: true
    save_last: true
    save_every: 1
    save_top_k: 5
    monitor: val_6h_mse
    mode: min
    resume: false
    auto_resume: false
    resume_path: null
    strict: true
    load_optimizer: true
  tensorboard:
    enabled: true
    log_dir: outputs/baselines/tensorboard
    resume: true
    flush_secs: 30
    log_every_n_steps: 20
    write_jsonl_fallback: true
metrics:
  report_global:
  - RMSE
  - MAE
  - Bias
  - CRPS
  - ACC
  report_per_variable:
  - RMSE
  - MAE
  - Bias
  - CRPS
  - ACC
  deterministic_crps: single_member_equals_mae
baselines:
  protocol: corrdiff_loader_adapted_fair_static_protocol
  static_policy: same_static
  report_groups:
  - same_static
  - dynamic_only
  - static_zero
  - static_shuffle
  models:
  - name: corrdiff
    alias: corrdiff_same_static
    family: external_weather_baseline
    static_policy: same_static
    params:
      hidden_channels: 16
      mean_depth: 1
      correction_steps: 1
      dropout: 0.05
      residual: true
      include_coords: true
      include_hour: true
      noise_scale: 0.05
      train_noise_scale: 0.05
      eval_ensemble_size: 3
      return_ensemble_eval: true
  - name: corrdiff
    alias: corrdiff_dynamic_only
    family: external_weather_baseline
    static_policy: dynamic_only
    params:
      hidden_channels: 16
      mean_depth: 1
      correction_steps: 1
      dropout: 0.05
      residual: true
      include_coords: true
      include_hour: true
      noise_scale: 0.05
      train_noise_scale: 0.05
      eval_ensemble_size: 3
      return_ensemble_eval: true
  - name: corrdiff
    alias: corrdiff_static_zero
    family: external_weather_baseline
    static_policy: static_zero
    params:
      hidden_channels: 16
      mean_depth: 1
      correction_steps: 1
      dropout: 0.05
      residual: true
      include_coords: true
      include_hour: true
      noise_scale: 0.05
      train_noise_scale: 0.05
      eval_ensemble_size: 3
      return_ensemble_eval: true
  - name: corrdiff
    alias: corrdiff_static_shuffle
    family: external_weather_baseline
    static_policy: static_shuffle
    params:
      hidden_channels: 16
      mean_depth: 1
      correction_steps: 1
      dropout: 0.05
      residual: true
      include_coords: true
      include_hour: true
      noise_scale: 0.05
      train_noise_scale: 0.05
      eval_ensemble_size: 3
      return_ensemble_eval: true