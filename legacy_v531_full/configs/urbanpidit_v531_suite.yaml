        use_wind_aware_graph: false
        use_micromet_coupling: false
        use_process_proxy_encoder: false
        use_process_adaln: false
        use_urban_control_branch: false
        use_anisotropic_process_graph: false
        use_micromet_token_branches: false
        use_morphology_residual_head: false
        use_process_consistency_loss: false
        use_variable_graph: false
        use_dynamic_vg: false
        use_static_vg: false
        use_urban_graph: false
        use_legacy_urban_graph: false
      losses:
        feasibility:
          enabled: false
          lambda: 0.0
        structure:
          enabled: false
          fft_enabled: false
          grad_enabled: false
          lambda_fft: 0.0
          lambda_grad: 0.0
        process:
          enabled: false
          lambda_rh: 0.0
          lambda_drag: 0.0
          lambda_diurnal: 0.0
          lambda: 0.0
          lambda_roughness_wind: 0.0
          lambda_diurnal_building: 0.0
          lambda_impervious_d2m: 0.0
          lambda_wind_tcc: 0.0
