# UrbanPiDiT V5.3.1 MorphoProcessDiT 一键实验套件。
# 运行入口：python train_suite.py --config configs/urbanpidit_v531_suite.yaml --out_dir outputs/experiments/v531 --resume

version:
  name: UrbanPiDiT-V5.3.1-ExperimentSuite
  release: UrbanPiDiT-V5.3.1-MorphoProcessDiT-FullSuite
  experiment_count: 29

base: configs/urbanpidit_v531_reviewer_evidence.yaml

base_overrides:
  metrics:
    report_global: [RMSE, MAE, Bias, CRPS, ACC]
    report_per_variable: [RMSE, MAE, Bias, CRPS, ACC]
    acc:
      enabled: true
      climatology: train_mean_field
      weighting: coslat
      center: true
      log_per_channel: true
  static_perturb:
    mode: none
    seed: 42
    deterministic: true
    categorical_modes:
      landcover: 0
  dynamic_perturb:
    mode: none
  ablation:
    use_morphology_graph: true
    use_wind_aware_graph: true
  inference:
    val_mode: deterministic
    test_mode: ensemble
    fixed_seed: 42
    base_seed: 42
    seed_offset_per_batch: 100000
    ensemble_size: 20
    compute_crps: true
  logging:
    use_tensorboard: true
    use_wandb: false

two_stage:
  enabled: true
  stage1:
    name: stage1_6h
    overrides:
      forecast:
        lead_times: [1]
        eval_lead_times: [1]
        multi_horizon_inference: direct
        lead_weight_anneal:
          enabled: false
        rollout_finetune:
          enabled: false
      train:
        monitor: val/RMSE
        max_epochs: 250
        lr: 0.0005
  stage2:
    name: stage2_multi_lead
    init_from_stage1: true
    init_only_net: true
    init_strict: false
    overrides:
      forecast:
        lead_times: [1, 2, 3, 4]
        eval_lead_times: [1, 2, 3, 4]
        multi_horizon_inference: direct
        lead_weight_anneal:
          enabled: true
          start_weighting: inverse
          end_weighting: uniform
          warmup_epochs: 0
          anneal_epochs: 30
          schedule: linear
      train:
        monitor: val/RMSE_mean_leads
        max_epochs: 200
        lr: 0.0001

