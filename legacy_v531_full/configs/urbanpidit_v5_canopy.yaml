# UrbanPiDiT V5 canopy/morphology configuration.
# New modules are explicit and remain compatible with V4 data flow.

data_root: /3240608030/weather-q/data/processed_data/beijing

dynamic_vars: [d2m, sp, t2m, tcc, tp, u10, v10]
static_vars: [landcover, building_surface, buildings, building_volume, population]
include_static: true
broadcast_static: true

static_schema:
  categorical: [landcover]
  continuous: [building_surface, buildings, building_volume, population]
  categorical_cardinality:
    landcover: 20

k: 4
delta_t: 1
H: 8
W: 8

forecast:
  time_step_hours: 6
  lead_times: [1, 2, 3, 4]
  eval_lead_times: [1, 2, 3, 4]
  train_lead_time_sampling: curriculum
  curriculum_epochs: 30
  multi_horizon_inference: direct
  correlate_noise_across_leads: true
  max_lead_time_steps: 4
  train_objective: lead1_plus_k
  extra_leads_per_batch: 1
  force_include_short_lead: true
  lead_loss_weighting: inverse
  lead_weight_beta: 0.5
  normalize_lead_loss: true
  apply_aux_losses_to_all_leads: false
  lead_weight_anneal:
    enabled: true
    start_weighting: inverse
    end_weighting: uniform
    warmup_epochs: 0
    anneal_epochs: 30
    schedule: linear
  rollout_finetune:
    enabled: false

model:
  D: 256
  depth: 12
  heads: 4
  mlp_ratio: 4.0
  drop_path_rate: 0.10
  dropout: 0.10

diffusion:
  P_mean: -0.8
  P_std: 0.8
  sample_steps: 8
  t_start: 0.0
  t_end: 1.0

losses:
  reconstruction:
    use_channel_weights: true
    weights: [2.0, 1.0, 2.0, 0.25, 0.25, 1.0, 1.0]
  feasibility:
    enabled: true
    lambda: 0.2
  structure:
    enabled: true
    fft_enabled: true
    grad_enabled: true
    lambda_fft: 0.05
    lambda_grad: 0.5
  process:
    enabled: true
    lambda_rh: 0.0
    lambda_drag: 0.0
    lambda_diurnal: 0.0

physics:
  lambda: 0.2
  lambda_fft: 0.05
  lambda_grad: 0.5
  w_tp_nonneg: 1.0
  w_tcc_01: 1.0
  w_dew_leq_t: 0.5
  w_sp_nonneg: 0.1
  w_wind_div: 0.1
  fft_channel_weights: [1.0, 1.0, 1.0, 0.0, 0.0, 0.5, 0.5]
  grad_channel_weights: [1.0, 1.0, 1.0, 0.0, 0.0, 1.0, 1.0]

ablation:
  use_drop_path: true
  use_cross_attention: true
  use_position_encoding: true
  use_timestep_conditioning: true
  use_lead_time_conditioning: true
  use_channel_weights: true
  use_physics_loss: true
  use_fft_loss: true
  use_gradient_loss: true
  use_hard_physics: false
  use_adversarial: false
  use_distillation: false
  use_hybrid_attention: false
  use_multi_scale: false

  # V5 morphology/canopy modules. These use only historical/current context and static fields.
  use_variable_graph: false
  use_dynamic_vg: true
  use_static_vg: true
  use_urban_graph: false
  use_legacy_urban_graph: false
  use_static_morphology_encoder: true
  use_morphology_graph: true
  use_wind_aware_graph: true
  use_urban_canopy_coupling: true
  use_micromet_coupling: false
  canopy_coupling_mode: pre_transformer

morphology_graph:
  k: 8
  sigma: 1.0
  morphology_weight: 1.0
  spatial_weight: 1.0
  wind_weight: 0.5

urban_canopy:
  hidden_channels: 32
  drag_strength: 0.1
  thermal_strength: 0.1
  moisture_strength: 0.1
  cross_var_strength: 0.1

micromet_coupling:
  enabled: false
  mode: pre
  interleaved_interval: 1
  hidden_channels: 32
  enable_momentum_drag: true
  enable_thermal_storage: true
  enable_moisture_evaporation: true
  enable_ventilation_mixing: true
  max_drag: 0.2
  max_branch_scale: 0.1
  graph_cfg:
    k: 8
    sigma: 1.0
    enable_cache: false

metrics:
  acc:
    enabled: true
    climatology: train_mean_field
    weighting: coslat
    center: true
    log_per_channel: true
  deterministic:
    enabled: true
  probabilistic:
    enabled: true
  event:
    enabled: true
    thresholds:
      tp: [0.1, 1.0, 5.0]
      tcc: [0.5, 0.8]

train:
  seed: 42
  batch_size: 128
  num_workers: 8
  lr: 0.0001
  weight_decay: 0.0001
  max_epochs: 200
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  patience: 50
  min_delta: 0.0
  monitor: val/RMSE_mean_leads
  save_top_k: 10
  save_last: true
  log_every_n_steps: 50

eval:
  batch_size: 128
  num_workers: 8

inference:
  val_mode: deterministic
  test_mode: ensemble
  fixed_seed: 42
  base_seed: 42
  seed_offset_per_batch: 100000
  ensemble_size: 20
  compute_crps: true

logging:
  log_dir: logs
  run_name: urbanpidit_v5_canopy
  use_tensorboard: true
  use_wandb: false