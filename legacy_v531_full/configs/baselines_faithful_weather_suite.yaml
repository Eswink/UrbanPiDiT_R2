# 论文级 Faithful weather baselines 配置（large 变体，参数量 ~23M，对齐 UrbanPiDiT）。
#
# 启动方式：
  # conda run -p /3240608030/weather-q/weather python -m baselines.train_external_baselines \
  #   --config configs/baselines_faithful_weather_suite.yaml \
  #   --out_dir outputs/baselines/faithful
#
# 20 条目 = 4 模型 × (4 static 策略 + CorrDiff 双阶段)
# static 策略对齐 UrbanPiDiT: same_static / dynamic_only / static_zero / static_shuffle
# 论文对齐:
#   FourCastNet (Pathak 2022): AFNO + 6h MSE + rollout eval
#   GraphCast    (Lam 2022):     GNN + lead 条件 + rollout loss
#   GenCast      (Price 2024):   grid2mesh GNN → mesh sparse Transformer → mesh2grid GNN, EDM sigma_max=80
#   CorrDiff     (Mardani 2024): regression UNet → diffusion UNet residual correction + bottleneck attention
#
version:
  name: UrbanPiDiT-V5.3.1-MorphoProcessDiT-FaithfulBaselines
data_root: /3240608030/weather-q/data/processed_data/beijing
data:
  expose_hour: true
dynamic_vars:
- d2m
- sp
- t2m
- tcc
- tp
- u10
- v10
static_vars:
- landcover
- building_surface
- buildings
- building_volume
- population
include_static: true
broadcast_static: true
static_schema:
  categorical:
  - landcover
  continuous:
  - building_surface
  - buildings
  - building_volume
  - population
  categorical_cardinality:
    landcover: 20
k: 4
delta_t: 1
H: 8
W: 8
forecast:
  time_step_hours: 6
  lead_times:
  - 1
  - 2
  - 3
  - 4
train:
  batch_size: 256
  num_workers: 4
eval:
  batch_size: 256
  num_workers: 4
external_baseline_training:
  epochs: 200
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip: 1.0
  early_stopping:
    enabled: true
    monitor: val_6h_mse
    mode: min
    patience: 20
    min_delta: 0.0
    restore_best: true
  checkpoint:
    enabled: true
    save_last: true
    save_every: 1
    save_top_k: 5
    monitor: val_6h_mse
    mode: min
    resume: false
    auto_resume: false
    resume_path: null
    strict: true
    load_optimizer: true
  tensorboard:
    enabled: true
    log_dir: outputs/baselines/tensorboard
    resume: true
    flush_secs: 30
    log_every_n_steps: 20
    write_jsonl_fallback: true
metrics:
  report_global:
  - RMSE
  - MAE
  - Bias
  - CRPS
  - ACC
  report_per_variable:
  - RMSE
  - MAE
  - Bias
  - CRPS
  - ACC
baselines:
  protocol: faithful_paper_aligned_urban_reproductions
  static_policy: same_static
  report_groups:
  - same_static
  - dynamic_only
  - static_zero
  - static_shuffle
  models:
  - name: faithful_corrdiff
    alias: corrdiff_faithful_full_regression_same_static
    family: faithful_weather_baseline
    static_policy: same_static
    params:
      hidden_channels: 144
      cond_channels: 144
      channel_mult: &id001
      - 1
      - 2
      - 2
      dropout: 0.0
      use_attention: true
      num_attention_heads: 4
      training_stage: regression
      residual: true
      forecast_protocol: direct
      one_step_lead: 1
    forecast_protocol: direct
    train_protocol: direct
    train_lead_times:
    - 1
    - 2
    - 3
    - 4
    eval_lead_times:
    - 1
    - 2
    - 3
    - 4
  - name: faithful_corrdiff
    alias: corrdiff_faithful_full_regression_dynamic_only
    family: faithful_weather_baseline
    static_policy: dynamic_only
