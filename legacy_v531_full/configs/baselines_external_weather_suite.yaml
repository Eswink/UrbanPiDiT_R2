      modes: 4
      dropout: 0.05
      residual: true
      include_coords: true
      include_hour: true
      forecast_protocol: official_rollout
      one_step_lead: 1
    forecast_protocol: official_rollout
    eval_protocol: rollout
    one_step_lead: 1
    train_lead_times:
    - 1
    eval_lead_times:
