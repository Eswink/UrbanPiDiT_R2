[pytest]
testpaths = tests
python_files = test_*.py
# --strict-markers turns an unregistered/typo'd marker into an error instead of a
# silent no-op. This matters once GPU/network markers appear: a mistyped marker
# would otherwise let a test run (or be skipped) unintentionally.
addopts = -ra --strict-markers
markers =
    gpu: requires a real CUDA device; not available in the CPU-only container
    network: requires outbound network access; excluded from offline runs
    slow: takes noticeably longer than the default suite
