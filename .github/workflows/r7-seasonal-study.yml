name: R7 real seasonal multiseed and adaptive CPU study
on:
  push:
    branches: [r7/weather-reasoning]
permissions:
  contents: read
  actions: read
jobs:
  seasonal-study:
    if: contains(github.event.head_commit.message, '[seasonal-study]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -r requirements.txt -r requirements-r7-data.txt
      - name: Reuse verified actual four-season artifact
        uses: actions/download-artifact@v4
        with:
          name: r7-four-season-cpu-583ffa581495fa9b8fa7f6be6529b191da489146
          path: input_seasonal
          run-id: 35884443083
          github-token: ${{ github.token }}
      - name: Run predeclared study with networking prohibited
        run: |
          python - <<'PY'
          import runpy, socket, sys
          def deny(*args, **kwargs):
              raise RuntimeError('outbound networking prohibited during seasonal CPU study')
          socket.socket.connect = deny
          socket.create_connection = deny
          sys.argv = ['scripts/study_r7_seasonal_cpu.py',
                      '--source','input_seasonal/source/era5_four_season.nc',
                      '--receipt','input_seasonal/source/receipt.json','--out','outputs/seasonal_study']
          runpy.run_path(sys.argv[0],run_name='__main__')
          PY
      - name: Preserve exact source code
        if: always()
        run: |
          mkdir -p outputs/seasonal_study
          git archive --format=zip --output=outputs/seasonal_study/code.zip HEAD
          git rev-parse HEAD > outputs/seasonal_study/code_commit.txt
      - name: Preserve all trial outcomes and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-seasonal-study-${{ github.sha }}
          path: |
            outputs/seasonal_study/
            !outputs/seasonal_study/forecasts/cache.zarr/
          retention-days: 30
          if-no-files-found: warn
