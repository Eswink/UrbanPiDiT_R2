name: R7 CPU CI

on:
  push:
    branches: [r7/weather-reasoning]
  pull_request:
    branches: [main]

concurrency:
  group: r7-ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    if: github.event_name == 'push' || github.head_ref != 'r7/weather-reasoning'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 (full history) is required by the whitespace step
          # below: `git show --check HEAD` needs HEAD's parent to know what this
          # commit changed. Under the default depth=1, HEAD looks like a root
          # commit, so it inspects EVERY file and fails on trailing whitespace in
          # audit/*.log — captured tool output, not authored text.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-r7-data.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=68" wheel
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -r requirements.txt
          pip install -r requirements-r7-data.txt
      - name: Check repository conventions
        run: python tools/check_conventions.py
      - name: Compile active modules and check whitespace
        run: |
          python -m compileall -q data model training scripts train_r7_local.py evaluate_r7_local.py
          # Whitespace check on the pushed commit.
          #
          # Leave this fetch-depth alone: `git show --check HEAD` needs a parent
          # to diff against. In a depth=1 clone HEAD looks like a root commit,
          # so it inspects EVERY file and fails on trailing whitespace inside
          # audit/*.log, which is captured tool output rather than authored text.
          git show --check --format= HEAD
      - name: Run unit, integration and installed-wheel tests
        run: pytest -q
