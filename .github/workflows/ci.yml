name: R7 CPU CI

on:
  push:
    branches: [r7/weather-reasoning]
  pull_request:
    branches: [main]

concurrency:
  group: r7-ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    if: github.event_name == 'push' || github.head_ref != 'r7/weather-reasoning'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 (full history) is required by the whitespace step
          # below: `git show --check HEAD` needs HEAD's parent to know what this
          # commit changed. Under the default depth=1, HEAD looks like a root
          # commit, so it inspects EVERY file and fails on trailing whitespace in
          # audit/*.log — captured tool output, not authored text.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-r7-data.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=68" wheel
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -r requirements.txt
          pip install -r requirements-r7-data.txt
      - name: Check repository conventions
        run: python tools/check_conventions.py
      - name: Check campaign state
        # Master plan vs round brief vs GPU ledger vs evidence registration
        # (decision 0025). Read-only; exits 1 on hard drift.
        run: python tools/check_campaign_state.py --quiet
      - name: Check evidence index and candidate brief
        run: python tools/verify_r7_evidence_index.py --index docs/R7_EVIDENCE_INDEX.jsonl --root . --check-brief docs/R7_CANDIDATE_BRIEF.md
      - name: Compile active modules and check whitespace
        run: |
          python -m compileall -q data model training scripts train_r7_local.py evaluate_r7_local.py
          # Whitespace check on the pushed commit.
          #
          # Leave this fetch-depth alone: `git show --check HEAD` needs a parent
          # to diff against. In a depth=1 clone HEAD looks like a root commit,
          # so it inspects EVERY file and fails on trailing whitespace inside
          # audit/*.log, which is captured tool output rather than authored text.
          git show --check --format= HEAD
      - name: Run unit, integration and installed-wheel tests
        run: |
          set +e
          pytest -q --junitxml="$RUNNER_TEMP/r7-pytest.xml"
          test_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then
            python - "$RUNNER_TEMP/r7-pytest.xml" <<'PY' || true
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          def escaped(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          try:
              root = ET.parse(Path(sys.argv[1])).getroot()
              failed = []
              for case in root.iter('testcase'):
                  for kind in ('failure', 'error'):
                      for issue in case.findall(kind):
                          node = case.get('classname', '') + '::' + case.get('name', '')
                          failed.append(node + '\n' + (issue.text or issue.get('message', kind)))
              for message in failed[:50]:
                  print('::error title=pytest failure::' + escaped(message[:8000]))
              print(f'pytest JUnit recorded {len(failed)} failures/errors; exit status remains authoritative.')
          except Exception as exc:
              print('::warning title=pytest diagnostics unavailable::' + escaped(str(exc)))
          PY
          fi
          exit "$test_status"
