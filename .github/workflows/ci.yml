name: R7 CPU CI

on:
  push:
    branches:
      - r7/weather-reasoning
  pull_request:
    branches:
      - main

# Keep push and PR lifecycle cancellation independent. The R7 branch already
# receives authoritative CI on push; its Draft PR therefore skips the duplicate
# pytest job, while PRs from every other head branch into main still run CI.
concurrency:
  group: r7-ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    if: github.event_name == 'push' || github.head_ref != 'r7/weather-reasoning'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -r requirements.txt
          pip install -r requirements-r7-data.txt
      - name: Run unit and smoke tests
        run: pytest -q
