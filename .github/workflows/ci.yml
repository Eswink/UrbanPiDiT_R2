name: R7 CPU CI

on:
  push:
    branches:
      - r7/weather-reasoning
  pull_request:
    branches:
      - main

concurrency:
  group: r7-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -r requirements.txt
          pip install -r requirements-r7-data.txt
      - name: Run unit and smoke tests
        run: pytest -q
