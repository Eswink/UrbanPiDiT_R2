name: R7 anonymous ERA5 temporal metadata
on:
  push:
    branches: [r7/weather-reasoning]
permissions:
  contents: read
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[era5-temporal-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metadata client only
        run: pip install "icechunk>=1.1,<3" "zarr>=3.1,<4"
      - name: Inspect anonymous temporal tile geometry
        run: python scripts/probe_earthmover_era5.py --out outputs/earthmover_probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-era5-temporal-metadata-${{ github.sha }}
          path: outputs/earthmover_probe.json
          if-no-files-found: warn
          retention-days: 7
